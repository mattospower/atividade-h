<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema da Lanchonete</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PAINEL 1: AUTENTICAÇÃO -->
  <div id="painel-login" class="caixa">
    <h2 id="titulo-login">Acesso ao Sistema</h2>
    <p>Digite a senha de acesso:</p>
    <input type="password" id="campo-senha" placeholder="Senha (1234)">
    <button id="btn-entrar">Entrar</button>
    <p id="msg-erro" class="mensagem-erro"></p>
  </div>

  <!-- PAINEL 2: MENU DE PEDIDOS -->
  <div id="painel-menu" class="caixa escondido">
    <h2 id="titulo-menu">Menu da Lanchonete</h2>
    
    <!-- Botões com classe para seleção por seletor CSS -->
    <button class="opcao-menu" data-preco="15.00" data-nome="Hambúrguer">1 - Hambúrguer - R$ 15,00</button>
    <button class="opcao-menu" data-preco="20.00" data-nome="Pizza">2 - Pizza - R$ 20,00</button>
    <button class="opcao-menu" data-preco="6.00" data-nome="Refrigerante">3 - Refrigerante - R$ 6,00</button>
    <button class="opcao-menu" data-preco="10.00" data-nome="Batata Frita">4 - Batata Frita - R$ 10,00</button>

    <button id="btn-finalizar" class="btn-cancelar">0 - Finalizar Pedido</button>
    <p id="status-pedido" class="status-sucesso"></p>
  </div>

  <!-- PAINEL 3: RELATÓRIO DO PEDIDO -->
  <div id="painel-relatorio" class="caixa escondido">
    <h2>Resumo do Pedido</h2>
    <div id="lista-produtos"></div>
    <hr>
    <p id="out-subtotal">Subtotal: R$ 0,00</p>
    <p id="out-desconto">Desconto: R$ 0,00</p>
    <p id="out-total" class="texto-destaque">Total: R$ 0,00</p>
  </div>

  <!-- Vinculação do ficheiro JavaScript -->
  <script src="script.js"></script>
</body>
</html>
